apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: week02
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: python:3.12-alpine
      command: ["python", "-c"]
      args:
        - "while True:\n  sum(i*i for i in range(100000))"
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
