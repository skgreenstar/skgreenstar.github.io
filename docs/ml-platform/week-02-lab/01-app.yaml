apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-script
  namespace: week02
data:
  server.py: |
    from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
    import threading
    state = {"ready": True, "healthy": True}
    lock = threading.Lock()
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            with lock:
                if self.path == "/traffic-off":
                    state["ready"] = False
                    code, message = 200, "traffic disabled"
                elif self.path == "/traffic-on":
                    state["ready"] = True
                    code, message = 200, "traffic enabled"
                elif self.path == "/server-error":
                    state["healthy"] = False
                    code, message = 200, "liveness failure enabled"
                elif self.path == "/healthz":
                    code, message = (200, "healthy") if state["healthy"] else (503, "unhealthy")
                elif self.path == "/readyz":
                    code, message = (200, "ready") if state["ready"] else (503, "unready")
                elif self.path == "/startup":
                    code, message = 200, "started"
                else:
                    code, message = (200, "hello week02") if state["ready"] else (503, "unready")
            self.send_response(code)
            self.end_headers()
            self.wfile.write(message.encode())
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo
  namespace: week02
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: probe-demo
  template:
    metadata:
      labels:
        app: probe-demo
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python","-u","/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /app
              name: script
          startupProbe:
            httpGet:
              path: /startup
              port: 8080
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: probe-script
---
apiVersion: v1
kind: Service
metadata:
  name: probe-demo
  namespace: week02
spec:
  selector:
    app: probe-demo
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
