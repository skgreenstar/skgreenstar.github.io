<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">ML 플랫폼 전체 변경 추적 흐름</title><desc id="desc">원천 데이터에서 검증과 피처 생성, 학습, 모델 평가, 승인, Kubernetes 배포, 운영 관측으로 이어지며 메타데이터로 계보를 추적한다.</desc><rect width="1120" height="590" rx="24" fill="#f8fbff"/><text x="48" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#162b48">데이터부터 운영까지, 한 번의 릴리스를 추적하는 구조</text><text x="48" y="95" font-family="Arial,sans-serif" font-size="17" fill="#526681">각 단계의 산출물과 승인 근거를 연결한다</text><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5c7ab5"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="40" y="150" width="139" height="118" rx="14" fill="#e9f2ff" stroke="#a9bfdf"/><text x="109.5" y="194" font-size="18" font-weight="700" fill="#193d68">Raw Data</text><text x="109.5" y="223" font-size="12" fill="#45607c">source</text><text x="109.5" y="242" font-size="12" fill="#45607c">event time</text><path d="M180 208 H190" stroke="#5c7ab5" stroke-width="3" marker-end="url(#arr)"/><rect x="191" y="150" width="139" height="118" rx="14" fill="#e9f2ff" stroke="#a9bfdf"/><text x="260.5" y="194" font-size="18" font-weight="700" fill="#193d68">Validate</text><text x="260.5" y="223" font-size="12" fill="#45607c">schema</text><text x="260.5" y="242" font-size="12" fill="#45607c">timestamp</text><path d="M331 208 H341" stroke="#5c7ab5" stroke-width="3" marker-end="url(#arr)"/><rect x="342" y="150" width="139" height="118" rx="14" fill="#e9f2ff" stroke="#a9bfdf"/><text x="411.5" y="194" font-size="18" font-weight="700" fill="#193d68">Features</text><text x="411.5" y="223" font-size="12" fill="#45607c">definition</text><text x="411.5" y="242" font-size="12" fill="#45607c">snapshot</text><path d="M482 208 H492" stroke="#5c7ab5" stroke-width="3" marker-end="url(#arr)"/><rect x="493" y="150" width="139" height="118" rx="14" fill="#e9f2ff" stroke="#a9bfdf"/><text x="562.5" y="194" font-size="18" font-weight="700" fill="#193d68">Train</text><text x="562.5" y="223" font-size="12" fill="#45607c">run</text><text x="562.5" y="242" font-size="12" fill="#45607c">artifact</text><path d="M633 208 H643" stroke="#5c7ab5" stroke-width="3" marker-end="url(#arr)"/><rect x="644" y="150" width="139" height="118" rx="14" fill="#e9f2ff" stroke="#a9bfdf"/><text x="713.5" y="194" font-size="18" font-weight="700" fill="#193d68">Evaluate</text><text x="713.5" y="223" font-size="12" fill="#45607c">baseline</text><text x="713.5" y="242" font-size="12" fill="#45607c">segments</text><path d="M784 208 H794" stroke="#5c7ab5" stroke-width="3" marker-end="url(#arr)"/><rect x="795" y="150" width="139" height="118" rx="14" fill="#e5f5ec" stroke="#59a87b"/><text x="864.5" y="194" font-size="18" font-weight="700" fill="#193d68">Approve</text><text x="864.5" y="223" font-size="12" fill="#45607c">release manifest</text><text x="864.5" y="242" font-size="12" fill="#45607c"></text><path d="M935 208 H945" stroke="#5c7ab5" stroke-width="3" marker-end="url(#arr)"/><rect x="946" y="150" width="139" height="118" rx="14" fill="#e7eafa" stroke="#a9bfdf"/><text x="1015.5" y="194" font-size="18" font-weight="700" fill="#193d68">Kubernetes</text><text x="1015.5" y="223" font-size="12" fill="#45607c">image digest</text><text x="1015.5" y="242" font-size="12" fill="#45607c">model</text></g><rect x="55" y="335" width="1010" height="88" rx="16" fill="#fff" stroke="#bed0e6"/><text x="82" y="369" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193d68">Lineage / Traceability</text><text x="82" y="397" font-family="Arial,sans-serif" font-size="16" fill="#45607c">dataset_id  ·  feature_version  ·  code_commit  ·  run_id  ·  model_version  ·  release_id</text><path d="M970 268 V316 H560 V335" fill="none" stroke="#5c7ab5" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="55" y="462" width="1010" height="84" rx="16" fill="#eaf5f5" stroke="#8bc2be"/><text x="82" y="497" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#176764">Production monitoring → investigation → rollback or retraining</text><text x="82" y="526" font-family="Arial,sans-serif" font-size="16" fill="#386d6c">Latency / errors / drift / delayed labels · rollback to last approved release</text><path d="M560 423 V462" stroke="#5c7ab5" stroke-width="2.5" marker-end="url(#arr)"/></svg>