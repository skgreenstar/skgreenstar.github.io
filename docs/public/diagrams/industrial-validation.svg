<svg xmlns="http://www.w3.org/2000/svg" width="880" height="322" viewBox="0 0 880 322" role="img" aria-label="산업 시계열 검증: 과거로 학습하고 미래로 평가"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#3174d6" stroke-width="1.2"/></marker></defs><rect width="880" height="322" rx="20" fill="#f7faff"/><text x="30" y="50" font-size="23" font-weight="750" fill="#16345a">산업 시계열 검증: 과거로 학습하고 미래로 평가</text><text x="30" y="82" font-size="14" fill="#637995">예측 시점 이후 정보는 피처 생성에 사용하지 않는다</text><rect x="28" y="133" width="265.3333333333333" height="104" rx="14" fill="#ffffff" stroke="#cdddf4"/><text x="160.66666666666666" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#173a69">학습 구간</text><text x="160.66666666666666" y="204" text-anchor="middle" font-size="12" fill="#566f8e">과거 센서·정답</text><path d="M296.3333333333333 184h8" stroke="#3174d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="307.3333333333333" y="133" width="265.3333333333333" height="104" rx="14" fill="#eef5ff" stroke="#cdddf4"/><text x="440" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#173a69">검증 구간</text><text x="440" y="204" text-anchor="middle" font-size="12" fill="#566f8e">설정·모델 선택</text><path d="M575.6666666666666 184h8" stroke="#3174d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="586.6666666666666" y="133" width="265.3333333333333" height="104" rx="14" fill="#ffffff" stroke="#cdddf4"/><text x="719.3333333333333" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#173a69">평가 구간</text><text x="719.3333333333333" y="204" text-anchor="middle" font-size="12" fill="#566f8e">미래 성능 확인</text><text x="440" y="284" text-anchor="middle" font-size="13" fill="#547092">피처 전처리 fit은 학습 구간에만 적용 · 배치·설비별 검증은 별도 설계</text></svg>