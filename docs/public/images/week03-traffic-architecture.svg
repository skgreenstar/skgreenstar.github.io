<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">요청 전달 경로와 EndpointSlice 정보 갱신 경로</title>
<desc id="desc">실제 요청은 Client, Ingress 또는 Gateway, Service의 데이터 전달 구현, 준비된 Pod로 이동한다. EndpointSlice는 컨트롤 플레인에서 갱신되어 Service 백엔드 선택에 이용되며 요청이 직접 통과하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#2563eb"/></marker><marker id="dashed" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1180" height="610" fill="#f8fafc" rx="22"/>
<text x="32" y="50" fill="#0f172a" font-family="sans-serif" font-size="26" font-weight="700">Service 데이터 경로와 EndpointSlice 상태 경로</text>
<text x="32" y="83" fill="#475569" font-family="sans-serif" font-size="16">실선: 실제 트래픽 전달　 점선: 백엔드 정보 동기화</text>
<text x="35" y="135" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="700">Data plane · 요청 전달</text>
<g font-family="sans-serif" text-anchor="middle" fill="#172554">
<rect x="35" y="175" width="220" height="88" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="145" y="212" font-size="20" font-weight="700">Client</text><text x="145" y="239" font-size="15">HTTPS 요청</text>
<rect x="335" y="175" width="220" height="88" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="445" y="212" font-size="20" font-weight="700">Ingress / Gateway</text><text x="445" y="239" font-size="15">HTTP 라우팅 · TLS</text>
<rect x="635" y="175" width="220" height="88" rx="12" fill="#dbeafe" stroke="#93c5fd"/><text x="745" y="212" font-size="20" font-weight="700">Service 전달 구현</text><text x="745" y="239" font-size="15">ClusterIP · 백엔드 선택</text>
<rect x="935" y="175" width="210" height="88" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="1040" y="212" font-size="20" font-weight="700">Ready Pod</text><text x="1040" y="239" font-size="15">실제 추론 처리</text>
</g>
<g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M255 219 L330 219"/><path d="M555 219 L630 219"/><path d="M855 219 L930 219"/></g>
<text x="35" y="354" fill="#475569" font-family="sans-serif" font-size="18" font-weight="700">Control plane · 상태 정보</text>
<g font-family="sans-serif" text-anchor="middle" fill="#172554">
<rect x="260" y="405" width="255" height="94" rx="12" fill="#fef3c7" stroke="#fcd34d"/><text x="387" y="443" font-size="19" font-weight="700">Pod Readiness</text><text x="387" y="470" font-size="15">Kubelet → Pod 상태</text>
<rect x="630" y="405" width="260" height="94" rx="12" fill="#ede9fe" stroke="#c4b5fd"/><text x="760" y="443" font-size="19" font-weight="700">EndpointSlice</text><text x="760" y="470" font-size="15">주소 · Ready 조건</text>
</g>
<g stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#dashed)"><path d="M515 452 L625 452"/><path d="M760 400 L760 270"/></g>
<text x="35" y="557" font-family="sans-serif" fill="#475569" font-size="15">EndpointSlice는 요청이 거쳐 가는 네트워크 홉이 아니라, 백엔드 주소와 준비 상태를 담은 리소스다.</text>
</svg>