<text x="170.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">Run · 지표 · 등록 버전</text>
<rect x="370" y="100" width="260" height="100" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="500.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">Feast · 피처 정의</text>
