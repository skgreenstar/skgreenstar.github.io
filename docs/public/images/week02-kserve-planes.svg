<text x="800.0" y="238.0" text-anchor="middle" font-size="16" fill="#607086">생성·갱신</text>
<path d="M1000.0 305 C1000.0 405.0 1000.0 405.0 1000.0 502" fill="none" stroke="#99a4b4" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#gray)"/>
<text x="1000.0" y="393.0" text-anchor="middle" font-size="16" fill="#607086">배포·관리</text>
<path d="M350 560.0 L447 560.0" fill="none" stroke="#188c78" stroke-width="2"  marker-end="url(#green)"/>
<text x="400.0" y="548.0" text-anchor="middle" font-size="16" fill="#607086">요청</text>
<path d="M750 560.0 L847 560.0" fill="none" stroke="#188c78" stroke-width="2"  marker-end="url(#green)"/>
<text x="800.0" y="548.0" text-anchor="middle" font-size="16" fill="#607086">전달</text>
