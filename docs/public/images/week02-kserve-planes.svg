<text x="150.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">KServe Controller</text>
<text x="150.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">리소스 상태 조정</text>
