<text x="150.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">Gateway · Service</text>
<text x="150.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">추론 요청 라우팅</text>
</g>
<g transform="translate(850,505)"><rect width="300" height="110" rx="12" fill="white" filter="url(#shadow)"/>
<text x="150.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">Predictor Pod</text>
<text x="150.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">모델 로딩 · 추론 · 응답</text>
</g>
<text x="600" y="772" text-anchor="middle" font-size="18" fill="#5c6d83">Predictor의 런타임은 MLServer·Triton·vLLM 등 모델에 맞게 선택한다.</text></g></svg>