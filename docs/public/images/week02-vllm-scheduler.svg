<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">vLLM · 요청 스케줄링과 KV Cache</title><desc id="desc">입력 처리와 토큰 생성을 스케줄링하고, 이전 토큰의 계산 결과를 메모리 블록에 보관한다. 요청 길이와 동시성이 늘면 연산량·대기열·KV Cache 사용량을 함께 확인한다.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r=".9" fill="#cbd2db"/></pattern><filter id="shadow" x="-15%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1f3048" flood-opacity=".1"/></filter>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#557cc9"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#188c78"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#99a4b4"/></marker></defs>
<rect width="1200" height="840" rx="20" fill="#f5f7fa"/><rect width="1200" height="840" rx="20" fill="url(#dots)"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans KR, sans-serif">
<text x="48" y="52" font-size="28" font-weight="700" fill="#20344f">vLLM · 요청 스케줄링과 KV Cache</text>
<text x="48" y="86" font-size="18" fill="#607086">입력 처리와 토큰 생성을 스케줄링하고, 이전 토큰의 계산 결과를 메모리 블록에 보관한다.</text>
<rect x="40" y="535" width="1120" height="220" rx="16" fill="#eff0f9"/><text x="64" y="570" font-size="19" font-weight="600" fill="#425975">추론 엔진 · GPU 연산과 메모리 관리</text>
<path d="M200.0 260 C200.0 305.0 600.0 305.0 600.0 347" fill="none" stroke="#99a4b4" stroke-width="2"  marker-end="url(#gray)"/>
<path d="M600.0 260 C600.0 305.0 600.0 305.0 600.0 347" fill="none" stroke="#99a4b4" stroke-width="2"  marker-end="url(#gray)"/>
