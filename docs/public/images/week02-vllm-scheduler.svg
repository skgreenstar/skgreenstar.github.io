<text x="175.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">Continuous Scheduler</text>
<text x="175.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">단계별 요청 배치 조정</text>
</g>
<g transform="translate(100,610)"><rect width="430" height="105" rx="12" fill="white" filter="url(#shadow)"/>
<text x="215.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">Prefill · Decode</text>
<text x="215.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">입력 처리 / 반복 토큰 생성</text>
</g>
<g transform="translate(670,610)"><rect width="430" height="105" rx="12" fill="white" filter="url(#shadow)"/>
<text x="215.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">Paged KV Cache</text>
<text x="215.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">토큰 위치 ↔ 메모리 블록</text>
</g>
<text x="600" y="812" text-anchor="middle" font-size="18" fill="#5c6d83">요청 길이와 동시성이 늘면 연산량·대기열·KV Cache 사용량을 함께 확인한다.</text></g></svg>