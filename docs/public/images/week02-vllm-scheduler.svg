<path d="M600.0 460 C600.0 535.0 315.0 535.0 315.0 607" fill="none" stroke="#557cc9" stroke-width="2"  marker-end="url(#blue)"/>
<text x="457.5" y="523.0" text-anchor="middle" font-size="16" fill="#607086">연산 배치</text>
<path d="M600.0 460 C600.0 535.0 885.0 535.0 885.0 607" fill="none" stroke="#557cc9" stroke-width="2"  marker-end="url(#blue)"/>
<text x="742.5" y="523.0" text-anchor="middle" font-size="16" fill="#607086">캐시 관리</text>
<path d="M530 662.5 L667 662.5" fill="none" stroke="#99a4b4" stroke-width="2"  marker-end="url(#gray)"/>
<text x="600.0" y="650.5" text-anchor="middle" font-size="16" fill="#607086">참조·갱신</text>
<g transform="translate(50,150)"><rect width="300" height="110" rx="12" fill="white" filter="url(#shadow)"/>
<text x="150.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">요청 A</text>
<text x="150.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">짧은 입력 · 짧은 출력</text>
</g>
<g transform="translate(450,150)"><rect width="300" height="110" rx="12" fill="white" filter="url(#shadow)"/>
<text x="150.0" y="39" text-anchor="middle" fill="#243c59" font-size="22" font-weight="600">요청 B</text>
<text x="150.0" y="68" text-anchor="middle" fill="#6c7d92" font-size="17" font-weight="400">긴 입력 · 짧은 출력</text>
</g>
<g transform="translate(850,150)"><rect width="300" height="110" rx="12" fill="white" filter="url(#shadow)"/>
