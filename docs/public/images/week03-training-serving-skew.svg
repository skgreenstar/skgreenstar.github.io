<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 655" width="1120" height="655" role="img" aria-labelledby="title desc"><title id="title">Training–Serving Skew 학습과 서빙의 입력 처리 불일치</title><desc id="desc">실제 동일 온도 200도 섭씨를 학습에서는 200으로 사용하나 서빙에서는 화씨 392를 섭씨 변환 없이 모델에 넣어 불일치가 발생한다. 동일 전처리와 스키마 검증으로 해결한다.</desc><rect width="1120" height="655" rx="20" fill="#f8fafc"/><g font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="40" y="56" font-size="29" font-weight="700" fill="#0f172a">Training–Serving Skew</text><text x="40" y="86" font-size="17" fill="#475569">실제 입력은 같은데 학습과 서빙의 전처리가 다르면 예측 입력값이 달라진다.</text><rect x="35" y="123" width="500" height="325" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><rect x="585" y="123" width="500" height="325" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="64" y="164" font-size="23" font-weight="700" fill="#1d4ed8">학습 · Training</text><text x="614" y="164" font-size="23" font-weight="700" fill="#c2410c">서빙 · Serving</text><rect x="61" y="194" width="448" height="62" rx="11" fill="#dbeafe"/><text x="86" y="219" font-size="17" fill="#1e3a8a">실제 온도: 200℃</text><text x="86" y="244" font-size="15" fill="#334155">학습 데이터도 섭씨로 저장</text><rect x="611" y="194" width="448" height="62" rx="11" fill="#ffedd5"/><text x="636" y="219" font-size="17" fill="#9a3412">실제 온도: 200℃ = 392℉</text><text x="636" y="244" font-size="15" fill="#334155">센서 API는 화씨로 전달</text><path d="M285 260 V286 M835 260 V286" stroke="#64748b" stroke-width="2.5"/><path d="M278 279 L285 289 L292 279 M828 279 L835 289 L842 279" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="61" y="290" width="448" height="64" rx="11" fill="#dbeafe"/><text x="86" y="318" font-size="17" fill="#1e3a8a">전처리: 섭씨 값 유지</text><text x="86" y="340" font-size="15" fill="#334155">모델 입력: temperature = 200</text><rect x="611" y="290" width="448" height="64" rx="11" fill="#fee2e2"/><text x="636" y="318" font-size="17" fill="#991b1b">전처리 오류: 단위 변환 누락</text><text x="636" y="340" font-size="15" fill="#991b1b">모델 입력: temperature = 392</text><path d="M285 357 V378 M835 357 V378" stroke="#64748b" stroke-width="2.5"/><path d="M278 372 L285 382 L292 372 M828 372 L835 382 L842 372" fill="none" stroke="#64748b" stroke-width="2.5"/><rect x="61" y="382" width="448" height="48" rx="11" fill="#bfdbfe"/><text x="285" y="412" font-size="18" text-anchor="middle" fill="#1e40af" font-weight="700">모델이 기대한 입력 ✓</text><rect x="611" y="382" width="448" height="48" rx="11" fill="#fecaca"/><text x="835" y="412" font-size="18" text-anchor="middle" fill="#991b1b" font-weight="700">학습 기준과 다른 입력 ✕</text><rect x="35" y="473" width="1050" height="138" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text x="64" y="511" font-size="22" font-weight="700" fill="#166534">해결: 서빙 전에 학습과 같은 단위·전처리 규칙 적용</text><text x="64" y="547" font-size="18" fill="#166534">392℉ → 200℃로 변환 → temperature = 200 → 모델에 전달</text><text x="64" y="580" font-size="16" fill="#475569">피처 순서 · 정규화 기준 · 결측 처리 · 피처 시점도 동일하게 검증한다.</text></g></svg>