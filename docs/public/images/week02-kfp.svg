<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">KFP: 작은 값은 파라미터, 파일은 아티팩트로 전달한다</title><desc id="desc">각 단계는 별도 Pod다. Dataset 경로를 읽고 쓰며, 컬럼·자료형 검증은 코드가 수행한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#557190" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="600" rx="20" fill="#f4f7fc"/>
<text x="40" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#172b48">KFP: 작은 값은 파라미터, 파일은 아티팩트로 전달한다</text>
<path d="M240.0 200 L145.0 330" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M240.0 200 L625.0 330" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M760.0 200 L865.0 330" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M250 385.0 L280 385.0" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M490 385.0 L520 385.0" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M730 385.0 L760 385.0" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="400" height="100" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="240.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">실행 파라미터</text>
<text x="240.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">모델 URI · 데이터 해시 · 조회 시각</text>
<rect x="560" y="100" width="400" height="100" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="760.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">공유 저장소 · API</text>
<text x="760.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">입력 파일 · Registry · 결과 파일</text>
<rect x="40" y="330" width="210" height="110" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="145.0" y="364" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">1 · 입력 확인</text>
<text x="145.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">Entity / 시각 / 해시</text>
<rect x="280" y="330" width="210" height="110" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="385.0" y="364" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">2 · 피처 조회</text>
<text x="385.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">Feast → Dataset</text>
<rect x="520" y="330" width="210" height="110" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="625.0" y="364" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">3 · 모델 추론</text>
<text x="625.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">고정 모델 → Dataset</text>
<rect x="760" y="330" width="210" height="110" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="865.0" y="364" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">4 · 결과 저장</text>
<text x="865.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">스키마 · 행 수 검사</text>
<text x="40" y="568" font-family="sans-serif" font-size="17" fill="#405673">각 단계는 별도 Pod다. Dataset 경로를 읽고 쓰며, 컬럼·자료형 검증은 코드가 수행한다.</text></svg>