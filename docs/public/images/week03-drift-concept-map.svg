<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Data Drift, Prediction Drift, Concept Drift, Model Drift 관계도</title><desc id="d">입력 데이터 변화, 예측 출력 변화, 실제 정답의 규칙 변화는 서로 다른 진단 대상이며 모델 성능 저하로 이어질 수 있지만 반드시 그렇지는 않다.</desc><rect width="1200" height="700" fill="#f8fafc" rx="24"/><text x="38" y="54" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">DRIFT · 변한 대상부터 찾자</text><text x="38" y="86" font-family="Arial,sans-serif" font-size="16" fill="#475569">기준 기간(Reference)과 현재(Current)를 비교 · 설명용 개념도</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs><rect x="35" y="125" width="250" height="145" rx="16" fill="#dbeafe" stroke="#93c5fd"/><text x="55" y="163" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#1e3a8a">Data Drift</text><text x="55" y="196" font-size="17" font-family="Arial,sans-serif" fill="#1e3a8a">입력 X가 바뀜</text><text x="55" y="228" font-size="15" font-family="Arial,sans-serif" fill="#1e40af">P(X) · 라벨 불필요</text><rect x="335" y="125" width="250" height="145" rx="16" fill="#e0e7ff" stroke="#a5b4fc"/><text x="355" y="163" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#312e81">Prediction Drift</text><text x="355" y="196" font-size="17" font-family="Arial,sans-serif" fill="#312e81">예측 Ŷ이 바뀜</text><text x="355" y="228" font-size="15" font-family="Arial,sans-serif" fill="#3730a3">P(Ŷ) · 라벨 불필요</text><rect x="635" y="125" width="250" height="145" rx="16" fill="#dcfce7" stroke="#86efac"/><text x="655" y="163" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#14532d">Concept Drift</text><text x="655" y="196" font-size="17" font-family="Arial,sans-serif" fill="#14532d">현실 규칙이 바뀜</text><text x="655" y="228" font-size="15" font-family="Arial,sans-serif" fill="#166534">P(Y|X) · 라벨로 검증</text><rect x="920" y="125" width="245" height="145" rx="16" fill="#ffedd5" stroke="#fdba74"/><text x="940" y="163" font-size="23" font-weight="bold" font-family="Arial,sans-serif" fill="#9a3412">Model Drift</text><text x="940" y="196" font-size="17" font-family="Arial,sans-serif" fill="#9a3412">실제 성능이 저하됨</text><text x="940" y="228" font-size="15" font-family="Arial,sans-serif" fill="#9a3412">오차/지표 · 라벨 필요</text><path d="M160 272 L160 360 L1000 360 L1000 292" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/><path d="M760 272 L760 325 L1035 325 L1035 292" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/><text x="310" y="350" font-family="Arial,sans-serif" font-size="15" fill="#475569">성능 저하의 원인이 될 수 있지만 반드시 그렇지는 않음</text><rect x="35" y="408" width="1130" height="208" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="60" y="449" font-size="22" font-weight="bold" font-family="Arial,sans-serif" fill="#0f172a">제조 품질 회귀 모델 예시 · 온도 / 압력 / 속도 → 품질 점수</text><text x="60" y="493" font-size="18" font-family="Arial,sans-serif" fill="#1e40af">DATA: 생산 온도가 200℃ → 220℃로 이동</text><text x="60" y="525" font-size="18" font-family="Arial,sans-serif" fill="#3730a3">PREDICTION: 예측 품질 평균이 75점 → 82점으로 이동</text><text x="60" y="557" font-size="18" font-family="Arial,sans-serif" fill="#166534">CONCEPT: 같은 온도·압력에서도 설비 마모로 실제 품질이 달라짐</text><text x="60" y="589" font-size="18" font-family="Arial,sans-serif" fill="#9a3412">MODEL: 실제 품질과 예측값의 오차가 커짐 (원인은 추가 진단)</text><text x="38" y="663" font-size="15" font-family="Arial,sans-serif" fill="#64748b">※ Model Drift는 자료에 따라 변화 유형 전체를 뜻하기도 함. 이 문서는 실제 성능 저하의 뜻으로 명시함.</text></svg>