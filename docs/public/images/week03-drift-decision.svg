<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="465" viewBox="0 0 1160 465" role="img" aria-label="모델 드리프트 진단 의사결정 흐름도"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="1160" height="465" rx="20" fill="#f8fafc"/><text x="30" y="45" font-family="sans-serif" font-weight="700" font-size="25" fill="#0f172a">Drift 진단은 라벨의 유무에서 갈라진다</text><rect x="30" y="100" width="205" height="72" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="132.5" y="131" font-family="sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">운영 경보</text><text x="132.5" y="155" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="400" fill="#0f172a">p95 · 입력 · 예측 · 품질</text><rect x="285" y="100" width="205" height="72" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="387.5" y="131" font-family="sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">라벨/정답 확보?</text><text x="387.5" y="155" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="400" fill="#0f172a">결측·지연 확인</text><rect x="540" y="40" width="270" height="85" rx="12" fill="#e0f2fe" stroke="#94a3b8"/><text x="675" y="71" font-family="sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">정답이 아직 없다면</text><text x="675" y="95" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="400" fill="#0f172a">P(X), P(Ŷ) 변화 감시</text><rect x="540" y="185" width="270" height="85" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="675" y="216" font-family="sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">정답이 있다면</text><text x="675" y="240" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="400" fill="#0f172a">RMSE·MAE·R²·구간별 오차</text><rect x="860" y="100" width="270" height="85" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="995" y="131" font-family="sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">원인 분리</text><text x="995" y="155" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="400" fill="#0f172a">Data / Concept / Skew / Bug</text><rect x="860" y="300" width="270" height="90" rx="12" fill="#fed7aa" stroke="#94a3b8"/><text x="995" y="331" font-family="sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">승인 게이트</text><text x="995" y="355" font-family="sans-serif" text-anchor="middle" font-size="14" font-weight="400" fill="#0f172a">검증→후보 학습→카나리</text><path d="M235 136 L285 136" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M490 129 L540 82" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M490 151 L540 227" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M810 82 L860 125" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M810 227 L860 162" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><path d="M995 185 L995 300" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="427" font-family="sans-serif" font-size="14" fill="#475569">중요: 드리프트 감지는 자동 재학습 명령이 아니다. 레퍼런스 기간·모델 버전·라벨 지연·데이터 파이프라인을 함께 검증한다.</text></svg>