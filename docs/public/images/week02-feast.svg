<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Feast: 정의와 실제 피처 값은 다른 경로로 관리한다</title><desc id="desc">Registry는 정의, Offline/Online Store는 값이다. apply만으로 Online 값이 채워지지 않는다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#557190" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="600" rx="20" fill="#f4f7fc"/>
<text x="40" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#172b48">Feast: 정의와 실제 피처 값은 다른 경로로 관리한다</text>
<path d="M300 150.0 L370 150.0" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M300 380.0 L700 150.0" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="508.0" y="257.0" font-family="sans-serif" font-size="16" fill="#405673">materialize</text>
<path d="M300 380.0 L370 380.0" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M830.0 200 L830.0 325" stroke="#557190" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="260" height="100" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="170.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">피처 코드</text>
<text x="170.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">Entity · FeatureView</text>
<rect x="370" y="100" width="260" height="100" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="500.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">Registry</text>
<text x="500.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">apply: 정의 등록</text>
<rect x="700" y="100" width="260" height="100" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="830.0" y="134" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">Online Store</text>
<text x="830.0" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">설비별 최신 피처</text>
<rect x="40" y="325" width="260" height="110" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="170.0" y="359" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">Offline Store</text>
<text x="170.0" y="387" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">시각별 피처 이력</text>
<rect x="370" y="325" width="260" height="110" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="500.0" y="359" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">Historical 조회</text>
<text x="500.0" y="387" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">Entity + 예측 기준 시각</text>
<rect x="700" y="325" width="260" height="110" rx="12" fill="white" stroke="#9bb8e2" stroke-width="2"/>
<text x="830.0" y="359" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#203858">Online 조회</text>
<text x="830.0" y="387" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#203858">Entity → 최신 값</text>
<text x="40" y="568" font-family="sans-serif" font-size="17" fill="#405673">Registry는 정의, Offline/Online Store는 값이다. apply만으로 Online 값이 채워지지 않는다.</text></svg>