e="13" font-weight="400" fill="#172554">CPU · Queue 관찰</text><rect x="475" y="120" width="170" height="70" rx="12" fill="#f3e8ff" stroke="#94a3b8" stroke-width="1.2"/><text x="560" y="151" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172554">metrics-server</text><text x="560" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#172554">CPU 사용량 수집</text><rect x="690" y="120" width="170" height="70" rx="12" fill="#f3e8ff" stroke="#94a3b8" stroke-width="1.2"/><text x="775" y="151" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172554">HPA 판단</text><text x="775" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#172554">목표 Replica</text><rect x="690" y="275" width="170" height="70" rx="12" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.2"/><text x="775" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172554">새 Pod 생성</text><text x="775" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#172554">Scheduling / Pull</text><rect x="475" y="275" width="170" height="70" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="560" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172554">Readiness 확인</text><text x="560" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#172554">모델 로딩 완료</text><rect x="260" y="275" width="170" height="70" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.2"/><text x="345" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#172554">Service Endpoint</text><text x="345" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="400" fill="#172554">Ready Pod만 대상</text><text x="35" y="463" font-size="12" fill="#64748b" font-family="sans-serif">개념 아키텍처 · 운영 환경에서 실제 배포·측정한 결과가 아닌 학습용 설계도</text></svg>