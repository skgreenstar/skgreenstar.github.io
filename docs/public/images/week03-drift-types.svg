ont-family="sans-serif" fill="#64748b">Current</text><text x="40" y="745" font-size="13" font-family="sans-serif" fill="#64748b">Model Drift는 문헌에 따라 Data/Concept 변화를 포괄하기도 함. 여기서 04는 실제 성능 저하를 뜻함.</text></svg>