apiVersion: apps/v1
kind: Deployment
metadata:
  name: infer-api
  namespace: week03
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infer-api
  template:
    metadata:
      labels:
        app: infer-api
    spec:
      containers:
        - name: api
          image: week03-infer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: infer-api
  namespace: week03
spec:
  selector:
    app: infer-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
