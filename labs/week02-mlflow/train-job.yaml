apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-train
  namespace: week02
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: mlflow-train
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-week02-mlflow:0.1
          imagePullPolicy: Never
          command: ["python", "/app/train_compare_register.py"]
          args: ["--output-dir", "/outputs"]
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: results
              mountPath: /outputs
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: mlflow-results
