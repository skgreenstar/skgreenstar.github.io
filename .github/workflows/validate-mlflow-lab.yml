name: Validate MLflow lab
on:
  push:
    paths:
      - 'labs/week02-mlflow/**'
      - '.github/workflows/validate-mlflow-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/week02-mlflow/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: labs/week02-mlflow
      - name: Validate tracking-server HTTP and artifact proxy
        working-directory: labs/week02-mlflow
        shell: bash
        run: |
          set -euo pipefail
          MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false mlflow server --backend-store-uri sqlite:///server.db --serve-artifacts --artifacts-destination "$RUNNER_TEMP/mlflow-artifacts" --default-artifact-root mlflow-artifacts:/ --host 127.0.0.1 --port 5050 --workers 1 > server.log 2>&1 &
          LAB_SERVER_PID=$!
          trap 'kill "$LAB_SERVER_PID" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5050/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5050/health
          python train_compare_register.py --tracking-uri http://127.0.0.1:5050

      - uses: actions/upload-artifact@v4
        with:
          name: mlflow-lab-ci-validation
          path: |
            labs/week02-mlflow/outputs/comparison.csv
            labs/week02-mlflow/outputs/selection.json
            labs/week02-mlflow/outputs/dataset_contract.json
            labs/week02-mlflow/outputs/requirements-resolved.txt
